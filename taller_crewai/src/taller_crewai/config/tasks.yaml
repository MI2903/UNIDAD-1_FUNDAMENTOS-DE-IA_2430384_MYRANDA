tarea_investigacion:
  description: >
    Investiga las tendencias actuales y casos de uso de {topic}.
    Encuentra informacion relevante considerando que estamos en {current_year}.
    Incluye ventajas, desventajas y menciona tus fuentes.
  expected_output: >
    Una lista con 5 puntos clave sobre {topic}, cada uno con una breve
    explicacion y su fuente de informacion.
  agent: investigador_tecnologias

tarea_redaccion:
  description: >
    Usando los hallazgos de la investigacion, redacta un informe ejecutivo
    sobre {topic}. Incluye introduccion, puntos clave desarrollados
    y una conclusion con recomendaciones.
  expected_output: >
    Un informe completo en markdown con secciones: Introduccion,
    Hallazgos Principales y Conclusion.
    Formateado como markdown sin bloques de codigo
  agent: redactor_informe